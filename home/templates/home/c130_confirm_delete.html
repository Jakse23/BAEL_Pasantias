{% extends 'home.html' %}
{% load static %}

{% block content %}
<div class="app-content-header">
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-6">
                <h3 class="mb-0">Eliminar Aeronave</h3>
            </div>
        </div>
    </div>
</div>

<div class="app-content">
    <div class="container-fluid">
        <div class="card">
            <div class="card-body text-center">
                <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #ff5252; margin-bottom: 20px;"></i>
                <h4>¿Estás seguro de eliminar la aeronave?</h4>
                <p><strong>{{ c130.acronym }}</strong> - {{ c130.system }}</p>
                <p>Esta acción no se puede deshacer.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-trash"></i> Sí, eliminar
                    </button>
                    <a href="{% url 'home:apartado_tecnico' %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
